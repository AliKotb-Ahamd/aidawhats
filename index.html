<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام حجز عمليات أ.د. على قطب</title>
  <style>
    :root { --primary: #1e3a8a; --accent: #25d366; --bg: #f1f5f9; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; padding: 30px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); width: 94%; max-width: 420px; border-top: 12px solid var(--primary); }
    h1 { color: var(--primary); text-align: center; font-size: 24px; margin-bottom: 25px; font-weight: 900; }
    label { font-weight: 800; display: block; margin-top: 18px; color: #334155; font-size: 14px; }
    input, textarea { width: 100%; padding: 15px; margin-top: 8px; border-radius: 12px; border: 2px solid #e2e8f0; box-sizing: border-box; font-size: 16px; transition: 0.3s; font-family: inherit; }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.1); }
    .btn-group { margin-top: 30px; display: flex; flex-direction: column; gap: 12px; }
    button { width: 100%; padding: 18px; border-radius: 16px; border: none; font-weight: 800; cursor: pointer; font-size: 17px; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-wa { background: var(--accent); color: white; }
    .btn-img { background: var(--primary); color: white; }
    button:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); opacity: 0.95; }
    canvas { display: none; }
    #status { text-align:center; font-size:14px; color: var(--primary); margin-top:15px; font-weight: bold; min-height: 20px; }
  </style>
</head>
<body>

<div class="card">
  <h1>📌 طلب حجز عملية</h1>
  
  <label>👤 اسم المريض الكامل</label>
  <input type="text" id="name" placeholder="ادخل اسم المريض هنا...">

  <label>🧠 التشخيص الطبي (التفاصيل)</label>
  <textarea id="dx" rows="3" placeholder="اكتب التشخيص كاملاً هنا..."></textarea>

  <div class="btn-group">
    <button class="btn-img" onclick="generateImage()">✨ إنشاء كارت ذكي (نسخ)</button>
    <button class="btn-wa" onclick="sendWhatsApp()">💬 إرسال واتساب</button>
  </div>
  
  <p id="status"></p>
</div>

<canvas id="medicalCanvas" width="600" height="600"></canvas>

<script>
function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    for(let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = ctx.measureText(testLine);
        let testWidth = metrics.width;
        if (testWidth > maxWidth && n > 0) {
            ctx.fillText(line, x, y);
            line = words[n] + ' ';
            y += lineHeight;
        } else {
            line = testLine;
        }
    }
    ctx.fillText(line, x, y);
    return y;
}

function generateImage() {
    const name = document.getElementById("name").value.trim();
    const dx = document.getElementById("dx").value.trim();
    if (!name || !dx) { alert("⚠️ يرجى ملء البيانات أولاً"); return; }

    const canvas = document.getElementById('medicalCanvas');
    const ctx = canvas.getContext('2d');
    const today = new Date().toLocaleDateString('ar-EG');

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#1e3a8a";
    ctx.fillRect(0, 0, canvas.width, 25);
    
    ctx.fillStyle = "#1e3a8a";
    ctx.font = "bold 38px Arial";
    ctx.textAlign = "center";
    ctx.fillText("📌 طلب حجز عملية جراحية", canvas.width/2, 90);

    ctx.textAlign = "right";
    
    ctx.fillStyle = "#f8fafc";
    ctx.roundRect(40, 130, 520, 90, 15);
    ctx.fill();
    ctx.fillStyle = "#1e40af";
    ctx.font = "bold 22px Arial";
    ctx.fillText("👤 اسم المريض:", 540, 165);
    ctx.fillStyle = "#000000";
    ctx.font = "26px Arial";
    ctx.fillText(name, 540, 200);

    ctx.fillStyle = "#f8fafc";
    ctx.roundRect(40, 240, 520, 180, 15);
    ctx.fill();
    ctx.fillStyle = "#1e40af";
    ctx.font = "bold 22px Arial";
    ctx.fillText("🧠 التشخيص الطبي:", 540, 275);
    ctx.fillStyle = "#000000";
    ctx.font = "24px Arial";
    wrapText(ctx, dx, 540, 315, 480, 35);

    ctx.fillStyle = "#64748b";
    ctx.font = "bold 18px Arial";
    ctx.fillText(`تاريخ الطلب: ${today}`, 540, 460);

    ctx.fillStyle = "#1e3a8a";
    ctx.fillRect(0, 490, canvas.width, 110);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 45px Arial";
    ctx.textAlign = "center";
    ctx.fillText("عمليات أ.د. على قطب", canvas.width/2, 560);

    canvas.toBlob(blob => {
        const item = new ClipboardItem({ "image/png": blob });
        navigator.clipboard.write([item]).then(() => {
            const status = document.getElementById('status');
            status.innerText = "✅ تم إنشاء الكارت ونسخه! الصقه الآن في واتساب";
            setTimeout(() => status.innerText = "", 5000);
        });
    });
}

CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
  this.beginPath();
  this.moveTo(x + r, y);
  this.arcTo(x + w, y, x + w, y + h, r);
  this.arcTo(x + w, y + h, x, y + h, r);
  this.arcTo(x, y + h, x, y, r);
  this.arcTo(x, y, x + w, y, r);
  this.closePath();
  return this;
}

function sendWhatsApp() {
    const name = document.getElementById("name").value;
    const dx = document.getElementById("dx").value;
    if (!name || !dx) return alert("يرجى ملء البيانات");
    const msg = `🧠 *طلب حجز عملية*\n👤 *المريض:* ${name}\n🧠 *التشخيص:* ${dx}\n\n🏥 *عمليات أ.د. على قطب*`;
    window.open(`https://wa.me/201107639322?text=${encodeURIComponent(msg)}`, '_blank');
}
</script>
</body>
</html>
